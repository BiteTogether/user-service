spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true

server:
  port: 0

app:
  jwt:
    secret-key: test-secret-key-that-is-at-least-256-bits-long-for-hmac-sha256-algorithm
    expiration: 900
    refresh-expiration: 86400
  security:
    permit-paths: /actuator/**,/swagger-ui/**,/v3/api-docs/**,/api/v1/auth/**,/api/v1/users/validate
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: false

firebase:
  credentials-path: config/firebase-service-account.json
  storage-bucket: test-bucket
  base-url: https://firebasestorage.googleapis.com/v0/b/test-bucket/o

feign:
  chat-service:
    url: http://localhost:8083

logging:
  level:
    org.springframework.security: DEBUG

openapi:
  info:
    title: User Service Test
    description: Test API
    version: 1.0.0
    contact:
      name: Test
      email: test@test.com
  servers:
    - url: http://localhost
      description: Test server
    - url: http://localhost
      description: Test server 2

